server {
    listen 80;
    server_name worldautofrance.com www.worldautofrance.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name worldautofrance.com www.worldautofrance.com;
    root /usr/share/nginx/html;
    index index.html;

    # Masquer la version nginx
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/worldautofrance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldautofrance.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.env {
        deny all;
        return 404;
    }
    
    location ~ /\.git {
        deny all;
        return 404;
    }
    
    location ~ /\.htaccess {
        deny all;
        return 404;
    }
    
    location ~ /\.htpasswd {
        deny all;
        return 404;
    }
    
    # Bloquer les fichiers de backup
    location ~ \.(bak|backup|old|orig|save|swp|tmp)$ {
        deny all;
        return 404;
    }
    
    # Bloquer les attaques WordPress/PHP communes
    location ~ ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|myadmin|admin\.php) {
        return 444;
    }

    # SEO: Pages d'annonces pour les crawlers (location interne)
    location @seo_prerender {
        internal;
        proxy_pass http://backend:8001/seo/annonce/$listing_id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO: Pre-rendering pour la page liste des annonces
    location @seo_listings {
        internal;
        proxy_pass http://backend:8001/seo/annonces;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO: Pre-rendering pour les crawlers Google sur les pages d'annonces
    location ~ ^/annonce/([a-f0-9\-]+)$ {
        set $listing_id $1;
        
        # Détecter les crawlers et utiliser error_page pour rediriger
        if ($http_user_agent ~* "Google|Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebot|ia_archiver|AdsBot|APIs-Google|Mediapartners") {
            error_page 418 = @seo_prerender;
            return 418;
        }
        
        # Pour les utilisateurs normaux, servir l'app React
        try_files $uri $uri/ /index.html;
    }

    # SEO: Pre-rendering pour la page /annonces
    location = /annonces {
        if ($http_user_agent ~* "Google|Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebot|ia_archiver|AdsBot|APIs-Google|Mediapartners") {
            error_page 418 = @seo_listings;
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy vers le backend pour les pages SEO pré-rendues (accès direct)
    location /seo/ {
        proxy_pass http://backend:8001/seo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        
        # Limiter les méthodes HTTP autorisées
        limit_except GET POST PUT DELETE PATCH OPTIONS {
            deny all;
        }
    }

    # SEO: Sitemap et robots.txt doivent être servis par le backend
    location = /sitemap.xml {
        proxy_pass http://backend:8001/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/xml; charset=utf-8" always;
    }

    location = /robots.txt {
        proxy_pass http://backend:8001/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        client_max_body_size 50M;
        
        # Masquer les headers du backend
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Headers de sécurité complets
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com https://*.google.com https://*.googletagmanager.com https://*.google-analytics.com https://*.gstatic.com https://*.recaptcha.net https://code.jquery.com https://widget.mondialrelay.com https://*.posthog.com https://*.emergent.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://widget.mondialrelay.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; frame-src https://*.stripe.com https://*.google.com https://*.recaptcha.net https://*.googletagmanager.com; media-src 'self' blob: https: http:;" always;
}
